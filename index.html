      padding: 40px 24px;
      text-align: center;
    }

    .date-center {
      font-size: clamp(48px, 5vw, 82px);
      line-height: 1;
      color: #22345a;
      letter-spacing: 0;
    }

    @media (max-width: 900px) {
      .store-topbar-inner {
        padding: 28px 24px 0;
      }

      .store-brand {
        font-size: 20px;
      }

      .store-nav {
