<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vescently | store</title>
  <meta name="description" content="Vescently store landing page.">

  <link rel="stylesheet" href="./styles/site.css">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Archivo Black', sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #ececeb;
      color: #22345a;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .store-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .store-topbar {
      position: relative;
      z-index: 10;
    }

    .store-topbar-inner {
      max-width: 100%;
      padding: 42px 72px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .store-brand {
      font-size: 24px;
      line-height: 1;
      color: #22345a;
    }

    .store-nav {
      display: flex;
      align-items: center;
      gap: 34px;
      flex-wrap: wrap;
    }

    .store-nav a {
      font-size: 15px;
      line-height: 1;
      color: #000;
    }

    .store-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .date-center {
      font-size: clamp(48px, 5vw, 82px);
      line-height: 1;
      color: #22345a;
      letter-spacing: 0;
    }

    @media (max-width: 900px) {
      .store-topbar-inner {
        padding: 28px 24px 0;
      }

      .store-brand {
        font-size: 20px;
      }

      .store-nav {
        gap: 18px;
      }

      .store-nav a {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="store-shell">
    <header class="store-topbar">
      <div class="store-topbar-inner">
        <a class="store-brand" href="./index.html">vescently</a>

        <nav class="store-nav" aria-label="Main navigation">
          <a href="./index.html">Home</a>
          <a href="./store.html">Store</a>
          <a href="http://tiktok.com/@vescently" target="_blank" rel="noopener noreferrer">t</a>
          <a href="http://instagram.com/vescently" target="_blank" rel="noopener noreferrer">◎</a>
        </nav>
      </div>
    </header>

    <main class="store-main">
      <div class="date-center">??/??/2026</div>
    </main>
  </div>
</body>
</html>
